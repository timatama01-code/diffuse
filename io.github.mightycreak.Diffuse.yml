app-id: io.github.mightycreak.Diffuse
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: diffuse
finish-args:
  - --filesystem=xdg-run/gvfsd
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
modules:
  - name: diffuse
    buildsystem: meson
    builddir: true
    run-tests: true
    config-opts:
      - -Dlog_print_output=true
      - -Dlog_print_stack=true
      # Use the document portal and keep VCS commands inside the sandbox.
      - -Duse_flatpak=false
    sources:
      - type: dir
        path: .
